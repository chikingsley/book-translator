[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.uv.workspace]
members = [
    "frontend-idea/backend",
]

[project]
name = "book-translator"
version = "0.2.0"
description = "Composable OCR + translation backend for long-form book workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.26.0",
    "python-dotenv>=1.1.1",
    "pydantic>=2.11.7",
    "pymupdf>=1.26.3",
    "mistralai>=1.9.2",
    "requests>=2.32.4",
    "aiohttp>=3.12.14",
    "pypandoc>=1.15",
]

[project.scripts]
book-translator = "book_translator.cli:main"
create-ebook = "book_translator.create_ebook:main"

[dependency-groups]
dev = [
    "ruff>=0.12.4",
    "ty>=0.0.17",
    "pytest>=8.4.1",
    "types-requests>=2.32.4.20250611",
    "pymupdf-stubs>=1.0.0",
]

[tool.ty.environment]
root = ["."]

[tool.ty.src]
respect-ignore-files = true
include = [
    "book_translator/__init__.py",
    "book_translator/chaptering.py",
    "book_translator/cli.py",
    "book_translator/create_ebook.py",
    "book_translator/judging.py",
    "book_translator/models.py",
    "book_translator/ocr_backends.py",
    "book_translator/pipeline.py",
    "book_translator/reconciliation.py",
    "book_translator/translation_backends.py",
    "tests/**/*.py",
]
exclude = [
    "book_translator/archive/**",
    "book_translator/tests/**",
    "book_translator/0*.py",
]
